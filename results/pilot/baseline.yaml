data:
  image_size: 256
  num_workers: 4
  processed_dir: ../../data/processed_256
  splits_dir: splits
description: Five-epoch pilot on 1,200 COCO images
experiment_name: baseline_cnn_ae
model:
  base_channels: 64
  name: baseline_ae
seed: 42
training:
  batch_size: 16
  epochs: 5
  loss: mse
  lr: 0.0002
  num_visual_samples: 8
  optimizer: adam
  use_amp: true
  weight_decay: 0.0
