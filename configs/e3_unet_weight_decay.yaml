experiment_name: e3_unet_weight_decay
description: "E3: E2 with Adam weight decay set to 1e-4"
seed: 42

data:
  processed_dir: data/processed_256
  splits_dir: data/splits
  image_size: 256
  num_workers: 4

model:
  name: unet_resnet18
  pretrained: true
  freeze_encoder_epochs: 0

training:
  epochs: 30
  batch_size: 16
  optimizer: adam
  lr: 2.0e-4
  weight_decay: 1.0e-4
  loss: l1
  use_amp: true
  num_visual_samples: 8
